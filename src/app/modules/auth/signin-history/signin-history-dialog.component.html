<p-dialog
    [draggable]="false"
    [resizable]="false"
    [(visible)]="signInHistoryDialog.visibleDialog"
    [modal]="true"
    (onHide)="closeSignInHistoryDialog()"
    [style]="{ width: '50%' }"
    header="{{'signin-history' | transloco}}">

    <p-table [value]="loginHistoryData" stripedRows>
        <ng-template pTemplate="header">
            <tr>
                <th>{{ 'id' | transloco }}</th>
                <th>{{ 'ip-address' | transloco }}</th>
                <th>{{ 'datetime' | transloco }}</th>
                <th>{{ 'status' | transloco }}</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.ip }}</td>
                <td>{{ item.time }}</td>
                <td>
                    <p-tag
                        [severity]="item.status=='success' ? 'success' : 'danger' "
                        [value]=" item.status=='success' ? ('success' | transloco) : ('fail' | transloco) ">
                    </p-tag>
                </td>
            </tr>
        </ng-template>
    </p-table>
</p-dialog>
