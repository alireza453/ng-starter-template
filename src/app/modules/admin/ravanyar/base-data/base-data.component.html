<div class="flex min-w-0 flex-auto flex-col">
    <!-- Header -->
    <div
        class="mx-auto mt-6 flex w-full max-w-screen-xl flex-col gap-3 px-6 sm:px-8"
    >
        <!--        table-->

        <p-table
            #dt2
            stripedRows
            [scrollable]="true"
            scrollHeight="400px"
            [globalFilterFields]="['id', 'title']"
            [paginator]="true"
            dataKey="id"
            [rows]="3"
            [value]="baseDataItems"
            [rowsPerPageOptions]="[3, 5, 10, 15, 20]"
            [tableStyle]="{ 'min-width': '60rem' }"
        >
            <ng-template pTemplate="caption">
                <div
                    class="flex flex-col items-center justify-between gap-4 md:flex-row"
                >
                    <!--        form -->
                    <p-fieldset legend="ثبت اطلاعات جدید">
                        <div
                            class="flex flex-col items-center justify-center gap-4 sm:flex-row"
                        >
                            <p-select
                                [options]="categories"
                                [(ngModel)]="selectedCategory"
                                variant="filled"
                                optionLabel="value"
                                placeholder="انتخاب دسته بندی"
                                class="w-56"
                            />

                            <p-floatlabel variant="on">
                                <input
                                    id="title"
                                    pInputText
                                    [(ngModel)]="inputLabel"
                                />
                                <label for="title">{{
                                    selectedCategory
                                        ? selectedCategory.value
                                        : 'عنوان'
                                }}</label>
                            </p-floatlabel>

                            <p-button label="ثبت" icon="fa-regular fa-plus" />
                        </div>
                    </p-fieldset>

                    <div class="flex items-center justify-center gap-4">
                        <span class="text-xl font-bold">
                            {{ selectedCategory ? selectedCategory.value : '' }}
                        </span>
                        <input
                            pInputText
                            type="text"
                            (input)="
                                dt2.filterGlobal(
                                    $event.target.value,
                                    'contains'
                                )
                            "
                            placeholder="جستجوی عنوان"
                        />
                    </div>
                </div>
            </ng-template>
            <ng-template pTemplate="header">
                <tr>
                    <th>ردیف</th>
                    <th>عنوان</th>
                    <th>عملیات</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-item>
                <tr>
                    <td>{{ item.id }}</td>
                    <td>{{ item.title }}</td>
                    <td class="flex gap-2">
                        <p-button
                            severity="danger"
                            size="small"
                            icon="fa-light fa-trash-xmark"
                            label="حذف"
                            variant="outlined"
                        />
                        <p-button
                            severity="info"
                            size="small"
                            icon="fa-light fa-pen-to-square"
                            label="ویرایش"
                            variant="outlined"
                        />
                    </td>
                </tr>
            </ng-template>
            <!-- <ng-template pTemplate="footer">
                تعداد کل {{ items ? items.length : 0 }} مورد.
            </ng-template> -->
        </p-table>
    </div>
</div>
