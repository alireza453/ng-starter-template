<p-popover #op1>
    <div class="flex flex-col gap-4 w-[20rem]">
        <div>
            <span class="font-medium text-primary dark:text-surface-0 block mb-2">
                ویرایش
            </span>
            <form>
                <div class="flex flex-col gap-2">
                    <input [(ngModel)]="name" name="name" styleClass="w-full" pInputText
                           placeholder="عنوان" />
                    <input [(ngModel)]="display" name="display" styleClass="w-full" pInputText
                           placeholder="نام نمایشی" />
                    <p-button size="small"
                              styleClass="w-full"
                              label="ثبت تغییرات"
                              icon="pi pi-plus" (click)="editChild()"></p-button>

                    <p-button size="small"
                              severity="danger"
                              styleClass="w-full"
                              label="حذف"
                              icon="pi pi-plus" (click)="deleteChild()"></p-button>
                </div>
            </form>
        </div>
    </div>
</p-popover>
<p-button
    icon="fa-regular fa-edit"
    size="small"
    tooltipPosition="top"
    severity="info"
    (click)="op1.toggle($event)"
    variant="text"
    pTooltip="ویرایش"
></p-button>

<p-toast></p-toast>
