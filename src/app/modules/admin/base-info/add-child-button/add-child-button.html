<p-popover #op>
    <div class="flex flex-col gap-4 w-[20rem]">
        <div>
            <span class="font-medium text-primary dark:text-surface-0 block mb-2">
                افزودن زیر مجموعه به
                {{ this.node ? this.node.label : '#' }}
            </span>
            <form>
                <div class="flex flex-col gap-2">
                    <input [(ngModel)]="name" name="name" styleClass="w-full" pInputText placeholder="عنوان" />
                    <input [(ngModel)]="display" name="display" styleClass="w-full" pInputText placeholder="نام نمایشی" />
                    <p-button size="small" styleClass="w-full" label="افزودن" icon="pi pi-plus" (click)="addChild()"></p-button>
                </div>
            </form>
        </div>
    </div>
</p-popover>
<p-button
    icon="fa-regular fa-plus"
    size="small"
    tooltipPosition="top"
    severity="info"
    (click)="op.toggle($event)"
    variant="text"
    pTooltip="افزودن زیرمجموعه"
></p-button>

<p-toast></p-toast>
