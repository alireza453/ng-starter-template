<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Navigation -->
<fuse-vertical-navigation
    class="dark:bg-slate-900 bg-slate-50 print:hidden"
    mode="over"
    [name]="'mainNavigation'"
    [position]=" document.documentElement.getAttribute('dir')=='rtl' ? 'right' : 'left'  "
    [navigation]="navigation.default"
>
    <!-- Navigation header hook -->
    <ng-container fuseVerticalNavigationContentHeader>
        <div class="flex w-full items-center justify-between p-4 ">
            <!-- Logo -->
            <div class="flex items-center justify-center">
                <img class="w-8" src="images/logo/logo.svg" />
            </div>
            <scheme></scheme>
        </div>
        <!-- User -->
        <div class="flex w-full flex-col items-center p-4">
            <div class="relative h-24 w-24 flex items-center justify-center">
                @if (user.avatar) {
                    <img
                        class="h-full w-full rounded-full"
                        [src]="user.avatar"
                        alt="User avatar"
                    />
                }
                @if (!user.avatar) {
                    <p-avatar icon="pi pi-user" shape="circle" size="large"></p-avatar>
                }
            </div>
            <div class="mt-3 flex w-full text-surface-700 dark:text-surface-200 flex-col items-center justify-center">
                <div
                    class="w-full overflow-hidden text-ellipsis whitespace-nowrap text-center font-medium leading-normal"
                >
                    {{ user.name }}
                </div>
                <div
                    class="text-secondary mt-0.5 w-full overflow-hidden text-ellipsis whitespace-nowrap text-center text-md font-medium leading-normal"
                >
                    {{ user.email }}
                </div>
            </div>
        </div>
    </ng-container>
    <!--     Navigation footer hook -->
    <!--    <ng-container fuseVerticalNavigationContentFooter>-->
    <!--        <div-->
    <!--            class="mb-4 mt-2  flex h-16 flex-0items-center justify-center ps-2 ps-6 "-->
    <!--        >-->
    <!--            <img class="max-w-36" src="images/logo/logo-text-on-dark.svg" />-->
    <!--        </div>-->
    <!--    </ng-container>-->
</fuse-vertical-navigation>

<!-- Wrapper -->
<div class="flex w-full min-w-0 flex-auto flex-col ">
    <!-- Header -->
    <p-menubar>
        <ng-template #start>
            <div class="flex w-full items-center justify-between gap-1 sm:gap-2">

                <p-button
                    icon="fa-regular fa-light fa-bars-staggered"
                    severity="primary" variant="outlined" (click)="toggleNavigation('mainNavigation')">
                </p-button>
                <languages></languages>
                <fuse-fullscreen class="hidden md:block"></fuse-fullscreen>
                <notifications></notifications>
                <user></user>
                <quick-chat class="lg:hidden"></quick-chat>
            </div>
        </ng-template>
        <ng-template #end>
            <quick-chat class="hidden lg:block"></quick-chat>
        </ng-template>
    </p-menubar>

    <!-- Content -->
    <div class="flex flex-auto flex-col">
        <!-- *ngIf="true" hack is required here for router-outlet to work correctly.
             Otherwise, layout changes won't be registered and the view won't be updated! -->
        @if (true) {
            <router-outlet ></router-outlet>
        }

    </div>
</div>
