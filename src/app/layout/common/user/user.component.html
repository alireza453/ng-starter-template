<div class="flex relative">

    <p-button (click)="menu.toggle($event)" icon="fa-regular fa-light fa-user" variant="outlined"
              severity="secondary" aria-label="Save"></p-button>

    <div class="inline-flex w-2 h-2 rounded-full absolute -top-0.5 -end-0.5 " [ngClass]="getUserStatus()"></div>
</div>

<p-tieredMenu #menu [model]="userMenuItems" [popup]="true">
    <ng-template #item let-item let-hasSubmenu="hasSubmenu">
        <a pRipple class="flex items-center p-tieredmenu-item-link">

            @if (item.icon) {
                <i [class]="item.icon"></i>
            }
            <span class="ms-2 " [class]="item.styleClass">{{ item.label | transloco }}</span>

            <!--            <p-badge *ngIf="item.badge" class="ms-auto" [value]="item.badge" />-->

            <i *ngIf="hasSubmenu" class="fa-duotone fa-regular fa-chevron-left ltr:rotate-180 ms-auto"></i>
        </a>
    </ng-template>
</p-tieredMenu>

<signin-history-dialog ></signin-history-dialog>
